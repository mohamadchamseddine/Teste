{% extends "base.html" %}
{% block title %}Admin — Exchange{% endblock %}
{% block content %}
<h2 class="page-title">Painel Administrador</h2>

<div class="admin-section">
  <h3>Taxa de transação</h3>
  <div class="form-inline">
    <input type="number" id="feePct" step="0.01" min="0" max="100" placeholder="1.00">
    <span>%</span>
    <button class="btn btn-primary" onclick="saveFee()">Salvar Taxa</button>
  </div>
  <p id="feeMsg" class="msg"></p>
</div>

<div class="admin-section">
  <div class="section-header">
    <h3>Operadores</h3>
    <button class="btn btn-primary" onclick="openOpModal()">+ Novo Operador</button>
  </div>
  <div class="table-wrap">
    <table class="data-table">
      <thead><tr>
        <th>#</th><th>Usuário</th><th>Cargo</th><th>Status</th>
        <th>Ver Lucros</th><th>Ver Volume</th><th>Ver Caixa</th><th>Ações</th>
      </tr></thead>
      <tbody id="opBody"></tbody>
    </table>
  </div>
</div>

<div id="opModal" class="modal" style="display:none">
  <div class="modal-card">
    <h3>Novo Operador</h3>
    <form id="opForm">
      <div class="form-group">
        <label>Usuário</label>
        <input type="text" id="opUsername" required>
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="opPassword" required>
      </div>
      <div class="form-group">
        <label>Cargo</label>
        <select id="opRole">
          <option value="operator">Operador</option>
          <option value="admin">Administrador</option>
        </select>
      </div>
      <div id="opErr" class="alert alert-error" style="display:none"></div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Criar</button>
        <button type="button" class="btn btn-outline" onclick="closeOpModal()">Cancelar</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
  async function loadFee() {
    const f = await fetch('/api/settings/fee').then(r => r.json());
    document.getElementById('feePct').value = f.fee_pct;
  }
  async function saveFee() {
    const pct = parseFloat(document.getElementById('feePct').value);
    const msg = document.getElementById('feeMsg');
    try {
      await fetch('/api/settings/fee', {method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({fee_pct: pct})});
      msg.textContent = '✓ Taxa salva com sucesso!'; msg.className = 'msg msg-ok';
    } catch { msg.textContent = 'Erro ao salvar.'; msg.className = 'msg msg-err'; }
  }
  async function loadOps() {
    const ops = await fetch('/api/operators').then(r => r.json());
    document.getElementById('opBody').innerHTML = ops.map(o => `
      <tr id="op-${o.id}">
        <td>#${o.id}</td>
        <td>${o.username}</td>
        <td>${o.role}</td>
        <td><span class="badge ${o.is_active ? 'badge-green' : 'badge-red'}">${o.is_active ? 'Ativo' : 'Inativo'}</span></td>
        <td><input type="checkbox" ${o.can_see_profits?'checked':''} onchange="updatePerm(${o.id},'can_see_profits',this.checked)"></td>
        <td><input type="checkbox" ${o.can_see_volume?'checked':''} onchange="updatePerm(${o.id},'can_see_volume',this.checked)"></td>
        <td><input type="checkbox" ${o.can_see_balance?'checked':''} onchange="updatePerm(${o.id},'can_see_balance',this.checked)"></td>
        <td>
          <button class="btn btn-sm ${o.is_active ? 'btn-danger' : 'btn-outline'}" onclick="toggleActive(${o.id},${!o.is_active})">
            ${o.is_active ? 'Desativar' : 'Ativar'}
          </button>
        </td>
      </tr>`).join('');
  }
  async function updatePerm(id, field, value) {
    await fetch(`/api/operators/${id}`, {method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({[field]: value})});
  }
  async function toggleActive(id, newState) {
    await fetch(`/api/operators/${id}`, {method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({is_active: newState})});
    loadOps();
  }
  function openOpModal() { document.getElementById('opModal').style.display = 'flex'; }
  function closeOpModal() { document.getElementById('opModal').style.display = 'none'; }
  document.getElementById('opForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('opErr'); errEl.style.display = 'none';
    const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true;
    try {
      await fetch('/api/operators', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username: document.getElementById('opUsername').value, password: document.getElementById('opPassword').value, role: document.getElementById('opRole').value}),
      }).then(async r => { const d = await r.json(); if (!r.ok) throw new Error(d.detail); return d; });
      closeOpModal(); e.target.reset(); loadOps();
    } catch (err) { errEl.textContent = err.message; errEl.style.display = 'block'; }
    btn.disabled = false;
  });
  loadFee(); loadOps();
</script>
{% endblock %}
