<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso do Cliente — Exchange</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-body client-auth-body">
  <div class="auth-card">
    <div class="auth-logo">🔐</div>
    <h1 class="auth-title">Área do Cliente</h1>
    <p class="auth-sub">Entre com seu telefone e PIN</p>

    <form id="loginForm">
      <div class="form-group">
        <label>Número do telefone</label>
        <input type="tel" id="phone" required placeholder="5511999999999" autocomplete="tel">
        <small>Somente números, com código do país (55 para Brasil)</small>
      </div>
      <div class="form-group">
        <label>PIN (4 dígitos)</label>
        <input type="password" id="pin" required maxlength="4" inputmode="numeric"
               placeholder="••••" pattern="[0-9]{4}" autocomplete="current-password" class="otp-input">
      </div>
      <div id="loginErr" class="alert alert-error" style="display:none"></div>
      <button type="submit" class="btn btn-primary btn-full">Entrar</button>
    </form>

    <div class="auth-footer">
      <a href="/login">Acesso para operadores →</a>
    </div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('loginErr');
      errEl.style.display = 'none';
      const btn = e.target.querySelector('button');
      btn.disabled = true; btn.textContent = 'Verificando...';
      try {
        const r = await fetch('/api/client/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            phone: document.getElementById('phone').value,
            code: document.getElementById('pin').value,
          }),
        });
        if (r.ok) {
          window.location.href = '/client/dashboard';
        } else {
          const d = await r.json();
          errEl.textContent = d.detail || 'Telefone ou PIN inválido';
          errEl.style.display = 'block';
        }
      } catch {
        errEl.textContent = 'Erro de conexão';
        errEl.style.display = 'block';
      }
      btn.disabled = false; btn.textContent = 'Entrar';
    });
  </script>
</body>
</html>
