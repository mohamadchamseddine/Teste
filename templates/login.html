<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Exchange</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-logo">💱</div>
    <h1 class="auth-title">Exchange USDT ↔ USD</h1>
    <p class="auth-sub">Acesso para operadores</p>
    <form id="loginForm">
      <div class="form-group">
        <label>Usuário</label>
        <input type="text" id="username" required placeholder="Digite seu usuário" autocomplete="username">
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="password" required placeholder="Digite sua senha" autocomplete="current-password">
      </div>
      <div id="error" class="alert alert-error" style="display:none"></div>
      <button type="submit" class="btn btn-primary btn-full">Entrar</button>
    </form>
    <div class="auth-footer">
      <a href="/client/login">Acesso para clientes →</a>
    </div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('error');
      errEl.style.display = 'none';
      const btn = e.target.querySelector('button');
      btn.disabled = true;
      btn.textContent = 'Entrando...';
      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          })
        });
        if (r.ok) {
          window.location.href = '/dashboard';
        } else {
          const d = await r.json();
          errEl.textContent = d.detail || 'Credenciais inválidas';
          errEl.style.display = 'block';
        }
      } catch {
        errEl.textContent = 'Erro de conexão';
        errEl.style.display = 'block';
      }
      btn.disabled = false;
      btn.textContent = 'Entrar';
    });
  </script>
</body>
</html>
